[workspace]
resolver = "2"
members = [
  "crates/craft-core",
  "crates/reverse-adapter",
  "crates/compatibility-gate",
  "crates/entrepreneur-rea",
  "crates/mirofish-crucible",
  "crates/egm-architect",
  "crates/token-governance",
  "crates/ultimatrix-cli-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
